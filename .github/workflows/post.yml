name: post
on:
  schedule:
    - cron: "0 6,12,18 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y libraqm0 libfribidi0 ffmpeg
      - run: pip install requests pillow arabic-reshaper python-bidi google-api-python-client google-auth
      - run: python run.py
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      - run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add progress.json stats.json
          git commit -m "progress" || true
          git push
