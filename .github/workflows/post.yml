name: post
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
      - name: Run slot
        id: slot
        run: python slot.py
        env:
          EVENT: ${{ github.event_name }}
      - name: Run python run.py
        if: steps.slot.outputs.go == 'true'
        run: python run.py
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          TIKTOK_SESSION: ${{ secrets.TIKTOK_SESSION }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          SLOT: ${{ steps.slot.outputs.slot }}
      - name: Commit progress
        if: steps.slot.outputs.go == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add progress.json stats.json
          git commit -m "Update progress & stats [skip ci]" || echo "No changes"
          git pull --rebase
          git push
