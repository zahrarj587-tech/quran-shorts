name: post
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force post?'
        default: 'false'
      test_mode:
        description: 'Test Mode (Generate without uploading)'
        default: 'false'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run slot
        id: slot
        run: python slot.py
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ github.event.inputs.force }}
          
      - name: Run python run.py
        if: steps.slot.outputs.go == 'true'
        run: python run.py
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          SLOT: ${{ steps.slot.outputs.slot }}
          TEST_MODE: ${{ github.event.inputs.test_mode }}
          
      # الخطوة الجديدة: حفظ الفيديو لوضع التجربة
      - name: Upload Video Artifact
        if: steps.slot.outputs.go == 'true' && github.event.inputs.test_mode == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Generated-Video
          path: work/final.mp4
          
      - name: Commit progress
        if: steps.slot.outputs.go == 'true' && github.event.inputs.test_mode != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add progress.json stats.json
          git commit -m "Update progress & stats [skip ci]" || echo "No changes"
          git pull --rebase
          git push
